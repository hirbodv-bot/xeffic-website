media:
  - name: images
    label: Website images
    input: media
    output: /media
    rename: safe
    categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: email
        label: Contact email
        type: string
      - name: linkedin_url
        label: LinkedIn URL
        type: string
      - name: footer_text
        label: Footer description
        type: text
      - name: logo_light
        label: Header logo
        type: image
        options:
          media: images
      - name: logo_dark
        label: Footer logo
        type: image
        options:
          media: images
      - name: favicon
        label: Browser icon
        type: image
        options:
          media: images
  - name: home
    label: "Homepage"
    type: file
    path: content/home.json
    format: json
    fields:
      - name: page_label
        label: Page name
        type: string
        readonly: true
      - name: seo
        label: Search / browser settings
        type: object
        fields:
          - name: title
            label: Browser title
            type: string
          - name: description
            label: Meta description
            type: text
      - name: sections
        label: Page sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: id
            label: Section ID
            type: string
            readonly: true
          - name: label
            label: Section name
            type: string
            readonly: true
          - name: eyebrow
            label: Small heading / label
            type: string
          - name: title
            label: Main heading
            type: string
          - name: text
            label: Intro text
            type: text
          - name: image
            label: Main section image (optional)
            type: image
            options:
              media: images
              extensions: [jpg, jpeg, png, webp, gif, svg]
              rename: safe
          - name: image_alt
            label: Image description (alt text)
            type: string
          - name: gallery
            label: Extra images / gallery (optional)
            type: image
            options:
              media: images
              multiple:
                max: 20
              unique: true
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe
          - name: cards
            label: Cards / service blocks
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: id
                type: string
                readonly: true
              - name: label
                type: string
                readonly: true
              - name: kicker
                label: Small label
                type: string
              - name: title
                label: Card heading
                type: string
              - name: text
                label: Card text
                type: text
              - name: link_label
                label: Link text
                type: string
              - name: link_url
                label: Link URL
                type: string
              - name: image
                label: Card image (optional)
                type: image
                options:
                  media: images
                  extensions: [jpg, jpeg, png, webp, gif]
                  rename: safe
              - name: image_alt
                label: Card image description
                type: string
              - name: bullets
                label: Bullet points
                type: string
                list: true
          - name: items
            label: Other repeated items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: id
                type: string
                readonly: true
              - name: title
                label: Item label
                type: string
              - name: text
                label: Item text
                type: text
              - name: image
                label: Item image (optional)
                type: image
                options:
                  media: images
                  extensions: [jpg, jpeg, png, webp, gif]
                  rename: safe
              - name: image_alt
                label: Item image description
                type: string
